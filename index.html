<style>
/* Layout: one narrow phone column; each screen is a single task with big stacked buttons. */
:root {
  --bg: #EDF1F3;
  --surface: #FFFFFF;

}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F171E; --surface: #18232D; --ink: #EAF0F4; --muted: #A9B7C2; --line: #2E3D49;
    --accent: #5FA8E8; --accent-ink: #08131C; --bubble: #243440;
    --safe: #5CCB8C; --safe-bg: #15301F; --warn: #F0B45A; --warn-bg: #33270F;
    --danger: #FF8A80; --danger-bg: #3A1A18; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F171E; --surface: #18232D; --ink: #EAF0F4; --muted: #A9B7C2; --line: #2E3D49;
  --accent: #5FA8E8; --accent-ink: #08131C; --bubble: #243440;

  --danger: #FF8A80; --danger-bg: #3A1A18; color-scheme: dark;
}
html { font-size: var(--base); }
html.big { --base: 24px; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 1rem; line-height: 1.6; word-break: keep-all; overflow-wrap: break-word; }
.wrap { max-width: 560px; margin: 0 auto; padding-block: 16px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

h1, h2 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.3; text-wrap: balance; }

h2 { font-size: 1.6rem; }
p { margin: 0; }
.lead { color: var(--muted); }
.rule { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rule div { background: var(--surface); border: 2px solid var(--line); border-radius: 14px; padding: 12px 8px; text-align: center; font-weight: 700; }
.rule b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; color: var(--accent); }
.stack { display: flex; flex-direction: column; gap: 12px; }
.btn { font: inherit; font-weight: 700; font-size: 1.05rem; text-align: left; width: 100%; min-height: 64px; padding: 14px 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; display: flex; align-items: center; gap: 14px; }
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, .size:focus-visible, .brand:focus-visible, .link:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); justify-content: center; text-align: center; }
.btn .tag { font-size: 0.75rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--bubble); color: var(--muted); white-space: nowrap; }
.btn .grow { flex: 1; min-width: 0; }

.choice-n { font-family: var(--font-display); font-size: 1.3rem; color: var(--accent); width: 1.4em; flex: none; }
.phone { background: var(--surface); border: 2px solid var(--line); border-radius: 22px; overflow: hidden; }
.phone-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 2px solid var(--line); }

.phone-head .sub { font-size: 0.75rem; color: var(--muted); }
.chat { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.bub { max-width: 88%; background: var(--bubble); padding: 12px 14px; border-radius: 4px 18px 18px 18px; overflow-wrap: anywhere; }
.bub.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-radius: 18px 4px 18px 18px; }
.bub.note { align-self: center; max-width: 100%; background: transparent; border: 2px dashed var(--line); color: var(--muted); border-radius: 12px; font-size: 0.9rem; text-align: center; }
.bub .url { text-decoration: underline; color: var(--accent); }

.call { padding: 22px 16px; text-align: center; display: flex; flex-direction: column; gap: 6px; align-items: center; }

.call .num { font-family: var(--font-display); font-size: 1.6rem; }
.vframe { position: relative; aspect-ratio: 16 / 10; background: #0B1219; color: #FFFFFF; display: flex; align-items: flex-end; padding: 16px; box-sizing: border-box; }
.vframe .vbadge { position: absolute; top: 12px; left: 12px; font-size: 0.7rem; font-weight: 700; background: #F2C230; color: #111; border-radius: 6px; padding: 2px 8px; }
.vframe .vplay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%); width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.18); display: grid; place-items: center; font-size: 1.3rem; }
.vframe .vcap { font-family: var(--font-display); font-size: 1.25rem; line-height: 1.3; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
/* 수상한 점 찾기: 영상 화면 위에 누를 수 있는 영역(.hot)을 겹쳐 둠 */
.vstage { position: relative; aspect-ratio: 16 / 10; background: #0B1219; overflow: hidden; }
.vstage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hot { font: inherit; color: inherit; background: none; border: 3px dashed transparent; border-radius: 10px; cursor: pointer; padding: 6px 8px; text-align: left; position: relative; }
.hot.abs { position: absolute; padding: 0; }
.hot:hover { border-color: var(--line); }
.hot.found { border-color: var(--danger); border-style: solid; background: rgba(184, 50, 42, 0.14); }
.hot.found::after { content: attr(data-n); position: absolute; top: -12px; left: -12px; width: 26px; height: 26px; border-radius: 50%; background: var(--danger); color: #fff; font: 700 0.8rem/26px var(--font-body); text-align: center; }
.hot.reveal { border-color: var(--warn); border-style: solid; }
/* 번호 배지는 상자 안쪽 왼쪽에: 화면 가장자리에서 잘리지 않고 글자도 가리지 않게 */
.hot.found::after, .hot.reveal::after { top: 50% !important; left: 4px !important; transform: translateY(-50%); }
.hot.found:not(:empty), .hot.reveal:not(:empty) { padding-left: 36px; }
.hot.found:empty::after, .hot.reveal:empty::after { top: -12px !important; left: -12px !important; transform: none; } /* 그림 위 영역은 단서를 가리지 않게 바깥에 */
.hot.reveal::after { content: attr(data-n); position: absolute; top: -12px; left: -12px; width: 26px; height: 26px; border-radius: 50%; background: var(--warn); color: #fff; font: 700 0.8rem/26px var(--font-body); text-align: center; }
.vcap-hot { position: absolute; left: 8px; right: 8px; bottom: 8px; color: #fff; font-family: var(--font-display); font-size: 1.05rem; line-height: 1.3; background: rgba(0, 0, 0, 0.55); }
.vtimer { position: absolute; top: 8px; right: 8px; color: #111; background: #F2C230; font-weight: 700; font-size: 0.75rem; padding: 2px 8px; }
.vlogo { position: absolute; top: 8px; left: 8px; color: #fff; background: #C8102E; font-weight: 700; font-size: 0.75rem; padding: 2px 8px; }
.vmeta { padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; border-top: 2px solid var(--line); }
.vmeta .hot { width: 100%; }
.cmt { font-size: 0.85rem; display: flex; flex-direction: column; gap: 4px; }
.cmt span { color: var(--muted); font-size: 0.75rem; }
.score { display: flex; align-items: center; justify-content: space-between; font-weight: 700; }
.score b { font-family: var(--font-display); font-weight: 400; font-size: 1.6rem; color: var(--danger); }
.found-list { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.found-list li.miss { color: var(--warn); }
.tip { font-size: 0.9rem; color: var(--muted); min-height: 1.4em; }
.fam-banner { background: var(--safe-bg); border: 2px solid var(--safe); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.linkbox { font-size: 0.8rem; word-break: break-all; background: var(--bg); border: 2px solid var(--line); border-radius: 10px; padding: 10px; }
@media (prefers-reduced-motion: no-preference) {
  .hot.no { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
}
.bub.say::before { content: "영상 속 말: "; font-size: 0.75rem; font-weight: 700; color: var(--muted); display: block; }
.ask { font-weight: 700; font-size: 1.1rem; }
.speak { font: inherit; font-size: 0.85rem; font-weight: 700; color: var(--accent); background: none; border: 2px solid var(--accent); border-radius: 999px; padding: 6px 14px; align-self: flex-start; cursor: pointer; }
.verdict { border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; border: 2px solid; }
.verdict.safe { background: var(--safe-bg); border-color: var(--safe); }
.verdict.warn { background: var(--warn-bg); border-color: var(--warn); }
.verdict.danger { background: var(--danger-bg); border-color: var(--danger); }
.verdict .stamp { font-family: var(--font-display); font-size: 1.9rem; line-height: 1.2; }
.verdict.safe .stamp { color: var(--safe); }
.verdict.warn .stamp { color: var(--warn); }
.verdict.danger .stamp { color: var(--danger); }
.lesson { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
.lesson h2 { font-size: 1.3rem; }
.lesson ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 8px; }
.trail { font-size: 0.85rem; color: var(--muted); }
.card { background: var(--surface); border: 2px solid var(--line); border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 12px; }
label { font-weight: 700; }
input[type=text] { font: inherit; width: 100%; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); color: var(--ink); box-sizing: border-box; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.seg .btn { justify-content: center; text-align: center; }
.seg .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent); color: var(--accent-ink); }
.pw-card { border: 3px solid var(--accent); border-radius: 20px; padding: 20px; text-align: center; display: flex; flex-direction: column; gap: 8px; background: var(--surface); }
.pw-card .q { font-family: var(--font-display); font-size: 1.6rem; }
.pw-card .small { font-size: 0.85rem; color: var(--muted); }
.progress { height: 10px; background: var(--line); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); }
.table-box { overflow-x: auto; border: 2px solid var(--line); border-radius: 14px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.8rem; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { color: var(--muted); font-weight: 700; }
.link { font: inherit; font-size: 0.85rem; color: var(--muted); background: none; border: 0; text-decoration: underline; cursor: pointer; padding: 4px 0; align-self: center; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.row .btn { flex: 1 1 200px; justify-content: center; text-align: center; }
.msg { font-size: 0.85rem; color: var(--safe); min-height: 1.2em; }
.confirm { background: var(--danger-bg); border: 2px solid var(--danger); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.foot { font-size: 0.75rem; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .screen { animation: rise .25s ease-out; }
  @keyframes rise { from { transform: translateY(6px); } to { transform: none; } }
}
</style>

<div class="wrap" id="app" aria-live="polite"></div>

<script>
(function () {
  /* ---------- 저장소 (브라우저 안에만 저장) ---------- */
  const KEY = "mumchum-v1";
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) {} }
  let store = Object.assign({ played: {}, tests: [], plays: [], spots: [], pw: "", big: false, fam: null }, load());
  function persist() { save(store); }
  if (store.big) document.documentElement.classList.add("big");

  /* ---------- 가족 맞춤 연습 ----------
     자녀가 만든 링크 끝(#fam=...)에 호칭과 이름이 들어 있음. 서버로 보내지 않고 이 휴대폰에만 저장.
     시나리오 글의 {P}는 부모님 호칭(엄마·아빠…), {C}는 자녀 이름으로 바뀜 */
  try {
    const m = location.hash.match(/^#fam=(.+)$/);
    if (m) {
      const f = JSON.parse(decodeURIComponent(m[1]));
      store.fam = { p: String(f.p || "엄마").slice(0, 10), c: String(f.c || "").slice(0, 10) };
      persist();
      history.replaceState(null, "", location.pathname + location.search); // 주소창에서 이름 지우기
    }
  } catch (e) {}
  const tpl = t => String(t).replace(/\{P\}/g, (store.fam && store.fam.p) || "엄마").replace(/\{C\}/g, store.fam && store.fam.c ? ", " + store.fam.c : "");

  /* ---------- 시나리오 데이터 ---------- */
  const SC = [
    {
      id: "child", tag: "메신저", title: "자녀를 사칭한 문자",
      who: "모르는 번호", sub: "010-5821-●●●● · 문자", kind: "chat",
      nodes: {
        start: { msgs: [["them", "{P} 나야{C}. 폰 액정이 깨져서 수리 맡겼어 ㅠㅠ"], ["them", "이 번호는 임시폰이야. 급하게 부탁할 게 있는데 문자로 해줄 수 있어?"]],
          ask: "어떻게 하시겠어요?",
          choices: [["그래, 무슨 일이야? 하고 답장한다", "n2"], ["평소 쓰던 번호로 아이에게 직접 전화해 본다", "safe1"], ["누군지 모르니 답장하지 않는다", "safe2"]] },
        n2: { msgs: [["me", "그래, 무슨 일이야?"], ["them", "온라인으로 결제할 게 있는데 내 폰이 안 돼서. {P} 신분증 사진이랑 카드 번호 좀 보내줘"], ["them", "급해서 그래 빨리~"]],
          ask: "아이가 급하다고 해요. 어떻게 하시겠어요?",
          choices: [["신분증 사진과 카드 번호를 보낸다", "danger1"], ["가족 암호를 물어본다", "n3"], ["\"네 원래 번호로 전화할게\" 하고 대화를 멈춘다", "safe1"]] },
        n3: { msgs: [["me", "우리 집 암호가 뭐였지?"], ["them", "{P} 지금 그런 거 물어볼 때야? 급하다니까!!"], ["them", "나중에 다 설명할게. 일단 보내줘"]],
          ask: "암호를 대답하지 못해요.",
          choices: [["이상하다. 원래 번호로 아이에게 전화한다", "safe1"], ["애가 급하다니 그냥 보내준다", "danger1"]] },
        safe1: { end: "safe", text: "원래 번호로 전화해 보니 아이는 회사에서 일하는 중이었어요. 문자는 사기였습니다." },
        safe2: { end: "safe", text: "잘하셨어요. 가족에게 이런 문자가 왔다고 알리고, 번호를 차단하면 더 좋아요." },
        danger1: { end: "danger", text: "사기범이 신분증과 카드 정보로 어르신 이름의 휴대폰을 새로 만들고 대출을 받았어요." }
      },
      lesson: ["가족이 '폰이 고장 났다', '번호가 바뀌었다'며 돈이나 신분증을 달라고 하면 먼저 사기를 의심하세요.", "답장하지 말고, 휴대폰에 저장된 원래 번호로 직접 전화하세요.", "가족끼리 정한 암호를 물어보세요. 대답하지 못하면 사기입니다."]
    },
    {
      id: "bugo", tag: "문자 링크", title: "부고 문자",
      who: "010-7734-●●●●", sub: "문자", kind: "chat",
      nodes: {
        start: { msgs: [["them", "[부고] 故 박영식님께서 별세하셨기에 삼가 알려드립니다.\n장례식장 안내: |bit.ly/bugo-0412|"]],
          ask: "모르는 이름의 부고 문자가 왔어요.",
          choices: [["누가 돌아가셨는지 링크를 눌러 확인한다", "n2"], ["링크는 누르지 않고, 아는 사람에게 전화로 물어본다", "safe1"], ["문자를 지우고 번호를 차단한다", "safe2"]] },
        n2: { msgs: [["note", "링크를 누르니 '장례식장 안내 앱을 설치하세요'라는 화면이 나왔어요. [설치] 버튼이 크게 보입니다."]],
          ask: "어떻게 하시겠어요?",
          choices: [["[설치]를 누른다", "danger1"], ["이상하다. 화면을 닫고 가족에게 알린다", "warn1"]] },
        safe1: { end: "safe", text: "아는 사람들 중 돌아가신 분은 없었어요. 링크를 누르지 않은 것이 정답입니다." },
        safe2: { end: "safe", text: "잘하셨어요. 링크를 누르지 않으면 피해가 생기지 않아요." },
        warn1: { end: "warn", text: "다행히 앱은 설치하지 않았어요. 링크를 누른 것만으로도 위험할 수 있으니 118(한국인터넷진흥원)에 상담해 보세요." },
        danger1: { end: "danger", text: "설치한 앱이 악성 앱이었어요. 연락처와 문자, 은행 정보가 사기범에게 넘어갔습니다." }
      },
      lesson: ["부고·청첩장 문자 속 인터넷 주소(링크)는 누르지 마세요.", "진짜 부고라면 아는 사람에게 전화로 확인할 수 있어요.", "'앱을 설치하라'는 화면이 나오면 절대 누르지 마세요."]
    },
    {
      id: "parcel", tag: "문자 링크", title: "택배 주소 확인 문자",

  /* ---------- 화면: 시나리오 진행 ---------- */
  let cur = null; // { s, path:[] }
  function play(id) { cur = { s: SC.find(x => x.id === id), path: [] }; step("start"); }
  function step(nodeId) {
    const s = cur.s, n = s.nodes[nodeId];
    if (n.end) return ending(n);
    const video = s.kind === "video";
    const msgs = n.msgs.map(([w, t]) => `<div class="bub ${w === "me" ? "me" : w === "note" ? "note" : video ? "say" : ""}">${fmt(tpl(t))}</div>`).join("");
    const icon = { call: "☎", chat: "✉", video: "▶" }[s.kind];
    const head = `<div class="phone-head"><div class="avatar" aria-hidden="true">${icon}</div><div class="who">${esc(s.who)}<div class="sub">${esc(s.sub)}</div></div></div>`;
    const top = s.kind === "call" && nodeId === "start"
      ? `<div class="call"><span class="ring">걸려온 전화</span><span class="num">${esc(s.who)}</span></div>`
      : video && nodeId === "start"
        ? `<div class="vframe" role="img" aria-label="영상 화면: ${esc(plain(s.screen))}"><span class="vbadge">${esc(s.badge)}</span><span class="vplay" aria-hidden="true">▶</span><span class="vcap">${fmt(s.screen)}</span></div>${head}`
        : head;
    const readText = (video && nodeId === "start" ? plain(s.screen) + ". " : "") + n.msgs.map(m => plain(tpl(m[1]))).join(" ") + " " + n.ask + " " + n.choices.map((c, i) => (i + 1) + "번, " + c[0]).join(". ");
    render(`
      <p class="trail">${esc(s.title)}</p>
      <div class="phone">${top}<div class="chat">${msgs}</div></div>
      <button class="speak" id="read">소리로 듣기</button>
      <p class="ask">${esc(n.ask)}</p>
      <div class="stack">${n.choices.map((c, i) => `<button class="btn" data-pick="${c[1]}" data-label="${esc(c[0])}"><span class="choice-n">${i + 1}</span><span class="grow">${esc(c[0])}</span></button>`).join("")}</div>
    `);
    document.getElementById("read").onclick = () => speak(readText);
  }
  function ending(n) {
    const s = cur.s;
    store.played[s.id] = n.end;
    store.plays.push({ t: new Date().toISOString(), id: s.id, end: n.end, path: cur.path.join(" > ") });
    persist();
    render(`

  // 다음 시나리오로 가는 버튼 (마지막이면 가족 암호로)
  function nextButton(s) {
    const next = SC[SC.indexOf(s) + 1];
    return next ? `<button class="btn primary" data-play="${next.id}">다음 상황: ${esc(next.title)}</button>`

  /* ---------- 화면: 수상한 점 찾기 ---------- */
  let sp = null; // { s, d, found:[키...], t0, done }
  function spotPlay(id) {
    const s = SC.find(x => x.id === id), d = SPOT[id], total = Object.keys(d.clues).length;
    sp = { s, d, found: [], t0: Date.now(), done: false };
    render(`
      <p class="trail">${esc(s.title)} · 수상한 점 찾기</p>
      <h2>수상한 점을 찾아보세요</h2>
      <p class="lead">${esc(d.intro)}</p>
      <div class="phone" id="stage">${d.stage}</div>
      <p class="tip" id="tip" aria-live="polite"></p>
      <div class="card"><div class="score"><span>찾은 단서</span><b id="cnt">0 / ${total}</b></div><ol class="found-list" id="flist"></ol></div>
      <button class="btn" id="giveup">더 못 찾겠어요. 정답 보기</button>
      <div id="after" class="stack"></div>
    `);
  }
  function spotTap(b) {
    if (!sp || sp.done) return;
    const d = sp.d, tip = document.getElementById("tip");
    if (b.dataset.decoy) {
      tip.textContent = d.decoys[b.dataset.decoy];
      b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); // 흔들림 애니메이션 다시 재생
      return;
    }
    const k = b.dataset.clue;
    if (sp.found.includes(k)) return;
    sp.found.push(k);
    b.classList.add("found"); b.dataset.n = sp.found.length;
    const [name, why] = d.clues[k];
    document.getElementById("flist").insertAdjacentHTML("beforeend", `<li><b>${esc(name)}</b>: ${esc(why)}</li>`);
    document.getElementById("cnt").textContent = sp.found.length + " / " + Object.keys(d.clues).length;
    tip.textContent = "찾았어요! " + name;
    speak(name + ". " + why);
    if (sp.found.length === Object.keys(d.clues).length) spotFinish(false);
  }
  function spotFinish(gaveUp) {
    sp.done = true;
    const d = sp.d, keys = Object.keys(d.clues), total = keys.length, got = sp.found.length;
    let n = got;
    keys.filter(k => !sp.found.includes(k)).forEach(k => {
      const b = document.querySelector(`#stage [data-clue="${k}"]`);
      b.classList.add("reveal"); b.dataset.n = ++n;
      const [name, why] = d.clues[k];
      document.getElementById("flist").insertAdjacentHTML("beforeend", `<li class="miss"><b>놓친 단서 · ${esc(name)}</b>: ${esc(why)}</li>`);
    });
    store.spots.push({ t: new Date().toISOString(), id: sp.s.id, found: got, total, sec: Math.round((Date.now() - sp.t0) / 1000), gaveUp });
    persist();
    document.getElementById("giveup").remove();
    document.getElementById("tip").textContent = "";
    document.getElementById("after").innerHTML = `
      <div class="verdict ${got === total ? "safe" : "warn"}"><span class="stamp">${got === total ? "모두 찾았어요!" : `${total}개 중 ${got}개를 찾았어요`}</span>
        <p>${got === total ? "이제 비슷한 영상을 보면 이 단서들을 먼저 살펴보세요." : "놓친 곳은 노란색으로 표시했어요. 위 목록에서 이유를 읽어 보세요."} 단서를 하나라도 찾았다면, 사거나 신청하기 전에 꼭 가족이나 약사·주민센터에 먼저 물어보세요.</p></div>
      ${nextButton(sp.s)}`;
    document.getElementById("after").scrollIntoView({ behavior: "smooth", block: "nearest" });
  }

        </ol>
        <label for="pwq">우리 가족 암호 질문</label>
        <input type="text" id="pwq" maxlength="40" placeholder="예: 우리 첫 강아지 이름은?" value="${esc(store.pw)}">
        <button class="btn primary" id="pwsave">암호 카드 만들기</button>
      </div>
      <div id="pwcard"></div>
      <div class="card">
        <p><b>이상하면 이렇게 하세요</b></p>
        <ol style="margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px">
          <li>일단 전화나 문자를 끊어요.</li>
          <li>휴대폰에 저장된 원래 번호로 가족에게 전화해요.</li>
          <li>그래도 이상하면 112(경찰)나 1332(금융감독원)에 물어봐요.</li>
        </ol>
      </div>
      <div class="card">
        <p><b>자녀분께: 부모님께 맞춤 연습 보내기</b></p>
        <p class="lead" style="font-size:0.9rem">진짜 사기범도 가족 이름을 알고 연락해요. 아래를 채워 링크를 보내면, 부모님 휴대폰의 '자녀 사칭 문자'가 우리 가족 이름으로 나와요. 이름은 서버로 보내지 않아요.</p>
        <label for="famp">부모님을 부르는 말</label>
        <input type="text" id="famp" maxlength="10" placeholder="예: 엄마, 아빠, 어머니" value="${esc((store.fam && store.fam.p) || "엄마")}">
        <label for="famc">자녀 이름이나 호칭</label>
        <input type="text" id="famc" maxlength="10" placeholder="예: 민수, 막내" value="${esc((store.fam && store.fam.c) || "")}">
        <button class="btn primary" id="famlink">맞춤 연습 링크 만들기</button>
        <div id="famout" class="stack"></div>
      </div>
      <button class="link" data-go="home">처음으로</button>
    `);
    document.getElementById("famlink").onclick = () => {
      const p = document.getElementById("famp").value.trim() || "엄마", c = document.getElementById("famc").value.trim();
      const url = location.origin + location.pathname + "#fam=" + encodeURIComponent(JSON.stringify({ p, c }));
      const text = `${p}, 사기 문자 대처를 미리 연습해 보세요. 눌러서 열면 바로 시작돼요.`;
      document.getElementById("famout").innerHTML = `<div class="linkbox">${esc(url)}</div>
        <div class="row"><button class="btn" id="famsend">${navigator.share ? "카톡 등으로 보내기" : "링크 복사"}</button><button class="btn" id="famtry">이 휴대폰에서 미리 보기</button></div>
        <p class="msg" id="fammsg"></p>`;
      document.getElementById("famsend").onclick = () => {
        if (navigator.share) navigator.share({ title: "멈춤 연습장", text, url }).catch(() => {});
        else {
          const fail = () => { document.getElementById("fammsg").textContent = "위 주소를 길게 눌러 복사해 주세요."; };
          try { navigator.clipboard.writeText(text + "\n" + url).then(() => { document.getElementById("fammsg").textContent = "복사됐어요. 부모님께 붙여 넣어 보내세요."; }, fail); } catch (e) { fail(); }
        }
      };
      document.getElementById("famtry").onclick = () => { store.fam = { p, c }; persist(); play("child"); };
    };
    const show = () => {
      document.getElementById("pwcard").innerHTML = store.pw ? `<div class="pw-card"><span class="small">돈 이야기가 나오면 먼저 물어보기</span><span class="q">${esc(store.pw)}</span><span class="small">이 화면을 가족과 함께 보며 답을 정해 두세요. 답은 적지 마세요.</span></div>` : "";
    };
    show();
    document.getElementById("pwsave").onclick = () => { store.pw = document.getElementById("pwq").value.trim(); persist(); show(); };
  }

  /* ---------- 연구용: 사전·사후 검사 ---------- */
  let test = null;
  function testSetup() {
    let phase = "사전";
    render(`
      <h2>사전·사후 문제</h2>
      <p class="lead">연습 전에 한 번, 연습 후에 한 번 같은 문제 ${QUIZ.length}개를 풀어요. 정답은 알려 드리지 않아요.</p>
      <div class="card">
        <label for="pid">참여자 이름 또는 번호</label>
        <input type="text" id="pid" maxlength="20" placeholder="예: 참여자1">
        <span style="font-weight:700">언제 푸나요?</span>
        <div class="seg"><button class="btn" data-ph="사전" aria-pressed="true">연습 전 (사전)</button><button class="btn" data-ph="사후" aria-pressed="false">연습 후 (사후)</button></div>
        <p class="msg" id="err" style="color:var(--danger)"></p>
        <button class="btn primary" id="begin">문제 풀기 시작</button>
      </div>
      <button class="link" data-go="home">처음으로</button>
    `);
    app.querySelectorAll("[data-ph]").forEach(b => b.onclick = () => {
      phase = b.dataset.ph;
      app.querySelectorAll("[data-ph]").forEach(x => x.setAttribute("aria-pressed", x === b));
    });
    document.getElementById("begin").onclick = () => {
      const pid = document.getElementById("pid").value.trim();
      if (!pid) { document.getElementById("err").textContent = "참여자 이름이나 번호를 적어 주세요."; return; }
      test = { pid, phase, ans: [], t0: Date.now() };
      testQ();
    };
  }
  function testQ() {
    const i = test.ans.length, q = QUIZ[i];
    render(`
      <p class="trail">${esc(test.pid)} · ${test.phase} · ${i + 1} / ${QUIZ.length}</p>
      <div class="progress" aria-hidden="true"><i style="width:${(i / QUIZ.length) * 100}%"></i></div>
      <h2 style="font-size:1.35rem">${esc(q.q)}</h2>
      <button class="speak" id="read">소리로 듣기</button>
      <p class="ask">가장 안전한 행동은?</p>
      <div class="stack">${q.o.map((o, k) => `<button class="btn" data-ans="${k}"><span class="choice-n">${k + 1}</span><span class="grow">${esc(o)}</span></button>`).join("")}</div>
    `);
    document.getElementById("read").onclick = () => speak(q.q + " 가장 안전한 행동은? " + q.o.map((o, k) => (k + 1) + "번, " + o).join(". "));
  }
  function testDone() {
    const score = test.ans.reduce((n, a, i) => n + (a === QUIZ[i].a ? 1 : 0), 0);
    store.tests.push({ t: new Date().toISOString(), pid: test.pid, phase: test.phase, score, n: QUIZ.length, ans: test.ans.map(a => a + 1).join(""), sec: Math.round((Date.now() - test.t0) / 1000) });
    persist();
    render(`
      <div class="verdict safe"><span class="stamp">수고하셨어요!</span><p>${esc(test.pid)}님의 ${test.phase} 문제가 저장됐어요.</p></div>
      <p class="trail">진행자 확인용: ${QUIZ.length}문제 중 ${score}문제 정답</p>
      ${test.phase === "사전" ? '<button class="btn primary" data-go="list">이제 연습하러 가기</button>' : '<button class="btn primary" data-go="records">기록 보기</button>'}
      <button class="link" data-go="home">처음으로</button>
    `);
    test = null;
  }

  /* ---------- 연구용: 기록 ---------- */
  function records() {
    const people = {};
    store.tests.forEach(r => { (people[r.pid] = people[r.pid] || {})[r.phase] = r; });
    const rows = Object.keys(people).map(p => {
      const a = people[p]["사전"], b = people[p]["사후"];
      const d = a && b ? b.score - a.score : null;
      return `<tr><td>${esc(p)}</td><td>${a ? a.score + "/" + (a.n || 5) : "-"}</td><td>${b ? b.score + "/" + (b.n || 5) : "-"}</td><td>${d === null ? "-" : (d > 0 ? "+" : "") + d}</td></tr>`;
    }).join("");
    const pre = store.tests.filter(r => r.phase === "사전"), post = store.tests.filter(r => r.phase === "사후");
    const avg = arr => arr.length ? (arr.reduce((n, r) => n + r.score / (r.n || 5), 0) / arr.length * 100).toFixed(0) + "%" : "-"; // 예전 기록(5문항)도 맞게 계산
    const ends = { safe: 0, warn: 0, danger: 0 };
    store.plays.forEach(p => ends[p.end]++);
    const spotLine = Object.keys(SPOT).map(id => {
      const rs = store.spots.filter(r => r.id === id);
      return `${esc(SC.find(s => s.id === id).title)}: ${rs.length ? "평균 " + (rs.reduce((n, r) => n + r.found, 0) / rs.length).toFixed(1) + " / " + rs[0].total + "개 (" + rs.length + "회)" : "-"}`;
    }).join("<br>");
    render(`
      <h2>저장된 기록</h2>
      <p class="lead">이 기록은 이 휴대폰(브라우저) 안에만 저장돼요. 테스트가 끝나면 아래 '기록 복사'로 옮겨 두세요.</p>
      <div class="card">
        <p><b>사전·사후 정답률</b> 사전 평균 ${avg(pre)} → 사후 평균 ${avg(post)}</p>
        <div class="table-box"><table><thead><tr><th>참여자</th><th>사전</th><th>사후</th><th>변화</th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4">아직 기록이 없어요. 사전 문제를 먼저 풀어 주세요.</td></tr>'}</tbody></table></div>
        <p><b>연습 결과</b> 안전 ${ends.safe}회 · 아슬아슬 ${ends.warn}회 · 피해 ${ends.danger}회 (총 ${store.plays.length}회)</p>
        <p><b>수상한 점 찾기</b><br>${spotLine}</p>
      </div>
      <div class="row"><button class="btn" id="copy">기록 복사 (CSV)</button><button class="btn" id="wipe">기록 모두 지우기</button></div>
      <p class="msg" id="msg"></p>
      <div id="confirm"></div>
      <textarea id="csvbox" hidden readonly style="width:100%;min-height:8em;font:inherit;font-size:0.75rem"></textarea>
      <button class="link" data-go="home">처음으로</button>
    `);
    document.getElementById("copy").onclick = () => {
      const lines = ["구분,시각,참여자,단계,점수,응답,소요초,시나리오,결과,선택경로"];
      store.tests.forEach(r => lines.push(["문제", r.t, r.pid, r.phase, r.score, "'" + r.ans, r.sec, "", "", ""].join(",")));
      store.spots.forEach(r => lines.push(["단서찾기", r.t, "", "", r.found, r.gaveUp ? "정답보기" : "", r.sec, r.id, r.found + "/" + r.total, ""].join(",")));
      store.plays.forEach(p => lines.push(["연습", p.t, "", "", "", "", "", p.id, p.end, '"' + p.path.replace(/"/g, "'") + '"'].join(",")));
      const csv = lines.join("\n");
      const box = document.getElementById("csvbox");
      const fallback = () => { box.hidden = false; box.value = csv; box.select(); document.getElementById("msg").textContent = "아래 글을 길게 눌러 복사해 주세요."; };
      try {
        navigator.clipboard.writeText(csv).then(() => { document.getElementById("msg").textContent = "복사됐어요. 메모장이나 엑셀에 붙여 넣으세요."; }, fallback);
      } catch (e) { fallback(); }
    };
    document.getElementById("wipe").onclick = () => {
      document.getElementById("confirm").innerHTML = `<div class="confirm"><p>정말 모든 기록을 지울까요? 되돌릴 수 없어요.</p><div class="row"><button class="btn" id="yes">지우기</button><button class="btn" id="no">취소</button></div></div>`;
      document.getElementById("yes").onclick = () => { store.tests = []; store.plays = []; store.spots = []; store.played = {}; persist(); records(); };
      document.getElementById("no").onclick = () => { document.getElementById("confirm").innerHTML = ""; };
    };
  }

  /* ---------- 클릭 처리 ---------- */
  const views = { home, list, family, testSetup, records };
  app.addEventListener("click", e => {
    const b = e.target.closest("button");
    if (!b) return;
    if (b.id === "famoff") { store.fam = null; persist(); home(); }
    else if (b.id === "size") {
      store.big = !store.big; persist();
      document.documentElement.classList.toggle("big", store.big);
      b.textContent = store.big ? "글씨 보통" : "글씨 크게"; b.setAttribute("aria-pressed", store.big);
    } else if (b.dataset.go) views[b.dataset.go]();
    else if (b.dataset.play) play(b.dataset.play);
    else if (b.dataset.spot) spotPlay(b.dataset.spot);
    else if (b.dataset.clue || b.dataset.decoy) spotTap(b);
    else if (b.id === "giveup" && sp && !sp.done) spotFinish(true);
    else if (b.dataset.pick) { cur.path.push(b.dataset.label); step(b.dataset.pick); }
    else if (b.dataset.ans !== undefined && test) {
      test.ans.push(+b.dataset.ans);
      test.ans.length >= QUIZ.length ? testDone() : testQ();
    }
  });

  home();
})();
</script>
